<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <clipPath id="win">
      <rect x="0" y="0" width="720" height="520" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect x="0" y="0" width="720" height="520" fill="#6E8BB8"/>
    <ellipse cx="70" cy="250" rx="160" ry="120" fill="#57A0C6" opacity="0.157"/>
    <ellipse cx="590" cy="160" rx="160" ry="130" fill="#B9CBE2" opacity="0.227"/>

    <!-- 卡片 -->
    <rect x="14" y="34" width="692" height="472" rx="16" ry="16" fill="#FFFFFF"/>

    <!-- 卡片头部 -->
    <text x="32" y="66" font-family="Microsoft YaHei UI" font-size="14" font-weight="bold" fill="#101826">桌面快捷方式生成器</text>
    <text x="32" y="84" font-family="Microsoft YaHei UI" font-size="8.25" fill="#6B7C93">为没有桌面图标的应用创建快捷方式</text>

    <!-- 总数胶囊 -->
    <rect x="610" y="52" width="78" height="24" rx="12" ry="12" fill="#EEF3FA"/>
    <text x="649" y="67" font-family="Microsoft YaHei UI" font-size="8.25" fill="#4E6E9E" text-anchor="middle">212 个应用</text>

    <!-- 搜索框 -->
    <rect x="32" y="104" width="656" height="34" rx="17" ry="17" fill="#EEF3FA"/>
    <circle cx="46" cy="121" r="5" fill="none" stroke="#8A9AAE" stroke-width="1.4"/>
    <line x1="49.5" y1="124.5" x2="53" y2="128" stroke="#8A9AAE" stroke-width="1.4"/>
    <text x="60" y="125" font-family="Microsoft YaHei UI" font-size="9.5" fill="#8A9AAE">搜索应用（名称或路径）</text>

    <!-- 工具栏 -->
