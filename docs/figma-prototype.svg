    <text x="688" y="164" font-family="Microsoft YaHei UI" font-size="8.25" fill="#6B7C93" text-anchor="end">已选 1 项 · 共 212 项</text>

    <!-- 列表表头 -->
    <text x="56" y="189" font-family="Microsoft YaHei UI" font-size="8.25" fill="#8A9AAE">应用名称</text>
    <text x="333" y="189" font-family="Microsoft YaHei UI" font-size="8.25" fill="#8A9AAE">类型</text>
    <text x="427" y="189" font-family="Microsoft YaHei UI" font-size="8.25" fill="#8A9AAE">路径 / AUMID</text>
    <line x1="24" y1="197.5" x2="696" y2="197.5" stroke="#E6EDF5" stroke-width="1"/>

    <!-- 第 1 行（选中） -->
    <rect x="28" y="200" width="664" height="33" rx="8" ry="8" fill="#F5F8FC"/>
    <rect x="28" y="209" width="3" height="15" rx="2" ry="2" fill="#4E6E9E"/>
    <rect x="36" y="209" width="14" height="14" rx="4" ry="4" fill="#4E6E9E"/>
    <polyline points="39,216 41.6,218.5 47,212" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="56" y="221" font-family="Microsoft YaHei UI" font-size="9" fill="#101826">计算器</text>
    <rect x="333" y="206" width="38" height="19" rx="9.5" ry="9.5" fill="#EEF3FA"/>
    <text x="352" y="219" font-family="Microsoft YaHei UI" font-size="7.9" fill="#4E6E9E" text-anchor="middle">UWP</text>
    <text x="427" y="220" font-family="Microsoft YaHei UI" font-size="7.9" fill="#6B7C93">Microsoft.WindowsCalculator_8wekyb3d8bbwe!App</text>

    <!-- 第 2 行 -->
    <rect x="36" y="246" width="14" height="14" rx="4" ry="4" fill="none" stroke="#C3D0E0" stroke-width="1.2"/>
    <text x="56" y="258" font-family="Microsoft YaHei UI" font-size="9" fill="#101826">微信</text>
    <rect x="333" y="245" width="38" height="19" rx="9.5" ry="9.5" fill="#F1EFE8"/>
    <text x="352" y="258" font-family="Microsoft YaHei UI" font-size="7.9" fill="#5F5E5A" text-anchor="middle">桌面</text>
    <text x="427" y="257" font-family="Microsoft YaHei UI" font-size="7.9" fill="#6B7C93">D:\WeChat\WeChat.exe</text>
    <line x1="36" y1="273.5" x2="688" y2="273.5" stroke="#F0F4F9" stroke-width="1"/>

    <!-- 第 3 行 -->
    <rect x="36" y="283" width="14" height="14" rx="4" ry="4" fill="none" stroke="#C3D0E0" stroke-width="1.2"/>
    <text x="56" y="295" font-family="Microsoft YaHei UI" font-size="9" fill="#101826">截图工具</text>
    <rect x="333" y="282" width="38" height="19" rx="9.5" ry="9.5" fill="#EEF3FA"/>
    <text x="352" y="295" font-family="Microsoft YaHei UI" font-size="7.9" fill="#4E6E9E" text-anchor="middle">UWP</text>
    <text x="427" y="294" font-family="Microsoft YaHei UI" font-size="7.9" fill="#6B7C93">Microsoft.ScreenSketch_8wekyb3d8bbwe!App</text>
    <line x1="36" y1="310.5" x2="688" y2="310.5" stroke="#F0F4F9" stroke-width="1"/>

    <!-- 状态栏 + 主按钮 -->
    <text x="32" y="483" font-family="Microsoft YaHei UI" font-size="8.25" fill="#6B7C93">共加载 212 个应用。勾选后点「创建到桌面」，或双击某一项直接创建。</text>
    <rect x="576" y="462" width="112" height="32" rx="16" ry="16" fill="#4E6E9E"/>
    <text x="632" y="482" font-family="Microsoft YaHei UI" font-size="8.25" fill="#FFFFFF" text-anchor="middle">创建到桌面</text>

    <!-- 自绘标题栏 -->
    <text x="14" y="22" font-family="Microsoft YaHei UI" font-size="8.25" fill="#FFFFFF" opacity="0.85">桌面快捷方式生成器</text>
    <rect x="646" y="8" width="26" height="20" rx="6" ry="6" fill="#FFFFFF" opacity="0.12"/>
    <line x1="654" y1="19" x2="664" y2="19" stroke="#FFFFFF" stroke-width="1.3" opacity="0.85"/>
    <rect x="680" y="8" width="26" height="20" rx="6" ry="6" fill="#B4524E" opacity="0.4"/>
    <line x1="688" y1="13" x2="698" y2="23" stroke="#FFFFFF" stroke-width="1.3" opacity="0.85"/>
    <line x1="698" y1="13" x2="688" y2="23" stroke="#FFFFFF" stroke-width="1.3" opacity="0.85"/>
  </g>
  <rect x="0.5" y="0.5" width="719" height="519" rx="14" ry="14" fill="none" stroke="#000000" opacity="0.06"/>
